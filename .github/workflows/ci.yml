name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test (library and unit tests)
        run: cargo test --release --locked --lib --bins

      # Integration perft does not require the NNUE file; the dedicated NNUE
      # load test is skipped here when the network is absent from the repo.
      - name: Test perft suite
        run: cargo test --release --locked --test perft -- --skip nnue_loads_and_eval_startpos
